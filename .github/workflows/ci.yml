name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated candidate matrix
        env:
          PYTHONPATH: .
        run: python scripts/run_candidate_matrix.py
      - name: Run AUT regressions under correct overlay
        env:
          PYTHONPATH: .
          INVARIANT_AUT_IMPLEMENTATION: correct
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-manifest
          path: execution-manifest.json
